name: Mantener despierto Evolution API

# Render (plan gratis) se duerme tras 15 min sin visitas.
# Este workflow lo visita cada 5 min de lunes a sábado, 6:00–22:00 hora de Monterrey (UTC-6).
on:
  schedule:
    - cron: "*/5 12-23 * * 1-6"       # 6:00–17:59 Monterrey, lun–sáb
    - cron: "*/5 0-3 * * 0,2,3,4,5,6" # 18:00–21:59 Monterrey, lun–sáb (en UTC ya es el día siguiente)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Evolution API
        run: curl -fsS -m 90 https://evolution-soporte-mtto.onrender.com/ || true
      - name: Ping bot (Vercel)
        run: curl -fsS -m 30 https://webchat-whatsapp-johnnazi.vercel.app/api/webhook || true
