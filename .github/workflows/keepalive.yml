name: Mantener despierto Evolution API

# Render (plan gratis) se duerme tras 15 min sin visitas.
# Este workflow lo visita cada 5 min de lunes a sábado, 6:00–18:00 hora de Monterrey (UTC-6).
# 6:00–15:30 el bot atiende normal; 15:30–18:00 avisa "fuera de horario" y pide el mensaje completo.
on:
  schedule:
    - cron: "*/5 12-23 * * 1-6" # 6:00–17:59 Monterrey, lun–sáb (ultimo ping 17:55, se duerme ~18:10)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Evolution API
        run: curl -fsS -m 90 https://evolution-soporte-mtto.onrender.com/ || true
      - name: Ping bot (Vercel)
        run: curl -fsS -m 30 https://webchat-whatsapp-johnnazi.vercel.app/api/webhook || true
